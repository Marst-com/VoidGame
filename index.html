<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>ASTERIA — V101</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

<div id="app">

  <!-- START SCREEN -->
  <section id="startScreen">

    <div class="start-glow"></div>

    <div class="start-card">

      <div class="eyebrow">
        DUOMARST EXPEDITION SYSTEM
      </div>

      <h1>ASTERIA</h1>

      <div class="version">
        EXPEDITION V101
      </div>

      <p>
        미지의 행성에 착륙했다.<br>
        탐사하고, 스캔하고, 살아남아라.
      </p>

      <button id="startButton">
        START EXPEDITION
      </button>

      <div class="controls-hint">
        WASD / 방향키 이동<br>
        마우스 드래그 카메라<br>
        SPACE 점프 · E 스캔
      </div>

    </div>

  </section>


  <!-- GAME -->
  <main id="game">

    <canvas id="gameCanvas"></canvas>


    <!-- HUD -->
    <div id="hud">

      <div class="hud-left">

        <div class="brand">
          ASTERIA
          <span>V101</span>
        </div>

        <div class="mission-panel">

          <div class="mission-label">
            MISSION 01
          </div>

          <div id="missionText">
            착륙 지점을 조사하라
          </div>

        </div>

      </div>


      <div class="status-panel">

        <div class="status-row">
          <span>HP</span>
          <div class="bar">
            <div id="hpBar"></div>
          </div>
        </div>

        <div class="status-row">
          <span>O₂</span>
          <div class="bar">
            <div id="oxygenBar"></div>
          </div>
        </div>

        <div class="status-row">
          <span>BAT</span>
          <div class="bar">
            <div id="batteryBar"></div>
          </div>
        </div>

      </div>


      <div class="resource-panel">

        <div>
          MINERALS
        </div>

        <strong id="mineralCount">
          0
        </strong>

      </div>


      <!-- DISCOVERY -->
      <div id="discovery">
        <div class="discovery-title">
          DISCOVERY
        </div>

        <div id="discoveryText">
          UNKNOWN
        </div>
      </div>


      <!-- SCAN MESSAGE -->
      <div id="scanMessage">
        SCANNING...
      </div>


      <!-- CROSSHAIR -->
      <div id="crosshair">
        <span></span>
      </div>


      <!-- MINIMAP -->
      <div id="minimap">

        <div class="map-ring"></div>

        <div id="mapPlayer"></div>

        <div id="mapShip"></div>

      </div>


      <!-- MOBILE CONTROLS -->
      <div id="mobileControls">

        <div id="joystick">
          <div id="joystickBase">
            <div id="joystickStick"></div>
          </div>
        </div>

        <div id="actionButtons">

          <button
            id="jumpButton"
            class="action-button"
          >
            JUMP
          </button>

          <button
            id="scanButton"
            class="action-button scan"
          >
            SCAN
          </button>

        </div>

      </div>

    </div>

  </main>

</div>


<script type="module" src="./src/main.js"></script>

</body>
</html>
